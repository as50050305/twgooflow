<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>法人資金流向</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f1; --surface:#fcfcfb; --surface-2:#efeeea; --surface-3:#e6e5e0;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#6f6d68; --grid:#e1e0d9; --axis:#c3c2b7;
  --border:rgba(11,11,11,.10); --accent:#2a78d6; --accent-ink:#1c5cab; --accent-wash:rgba(42,120,214,.10);
  --red:#d03b3b; --green:#138a36; --neutral:#c9c8c1; --warn:#b26b00;
  --l1:#2a78d6; --l2:#eb6834; --l3:#7a4fd0;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --fs:14px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --surface-3:#2e2e2b;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#9a988f; --grid:#2c2c2a; --axis:#45453f;
    --border:rgba(255,255,255,.10); --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:rgba(57,135,229,.16);
    --red:#ff6b66; --green:#3fcf6c; --neutral:#55554f; --warn:#f0a020;
    --l1:#5598e7; --l2:#ef7a4a; --l3:#9d85ec;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --surface-3:#2e2e2b;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#9a988f; --grid:#2c2c2a; --axis:#45453f;
  --border:rgba(255,255,255,.10); --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:rgba(57,135,229,.16);
  --red:#ff6b66; --green:#3fcf6c; --neutral:#55554f; --warn:#f0a020;
  --l1:#5598e7; --l2:#ef7a4a; --l3:#9d85ec;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
:root[data-colors="tw"]{ --up:var(--red); --down:var(--green); }
:root[data-colors="us"]{ --up:var(--green); --down:var(--red); }
:root[data-fs="s"]{ --fs:13px } :root[data-fs="m"]{ --fs:14.5px } :root[data-fs="l"]{ --fs:16.5px }

*{ box-sizing:border-box }
html{ font-size:var(--fs); -webkit-text-size-adjust:100% }
body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  line-height:1.5; overflow-x:hidden }
button,input,select{ font:inherit; color:inherit }
a{ color:var(--accent-ink) }
.up{ color:var(--up) } .down{ color:var(--down) } .flat{ color:var(--ink-2) }
.muted{ color:var(--muted) } .ink2{ color:var(--ink-2) } .small{ font-size:.86rem } .tiny{ font-size:.78rem }
.num{ font-variant-numeric:tabular-nums; white-space:nowrap }
.hidden{ display:none !important }

/* ---------- 頂部 ---------- */
header.top{ position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--border) }
.topbar{ display:flex; align-items:center; gap:.6rem; padding:.55rem 1rem; max-width:1400px; margin:0 auto; flex-wrap:wrap }
.brand{ font-weight:700; font-size:1.05rem; white-space:nowrap; display:flex; align-items:center; gap:.45rem }
.brand svg{ flex:none }
.mkt-chip{ font-size:.86rem; white-space:nowrap }
.topbar .spacer{ flex:1 }
.search{ position:relative; min-width:10rem; flex:0 1 16rem }
.search input{ width:100%; padding:.42rem .7rem; border:1px solid var(--border); border-radius:8px; background:var(--surface-2) }
.search .results{ position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; box-shadow:var(--shadow); max-height:60vh; overflow:auto; z-index:40 }
.search .results button{ display:flex; width:100%; gap:.6rem; padding:.45rem .7rem; border:0; background:none; text-align:left; cursor:pointer }
.search .results button:hover,.search .results button.sel{ background:var(--accent-wash) }
.iconbtn{ position:relative; border:1px solid var(--border); background:var(--surface-2); border-radius:8px; padding:.35rem .55rem; cursor:pointer; line-height:1; display:inline-flex; align-items:center; gap:.3rem }
.iconbtn:hover{ background:var(--surface-3) }
.badge{ position:absolute; top:-6px; right:-6px; background:var(--red); color:#fff; border-radius:9px; font-size:.7rem; padding:0 .32rem; min-width:1.1rem; text-align:center; line-height:1.1rem }
select.ctl{ padding:.35rem .5rem; border:1px solid var(--border); border-radius:8px; background:var(--surface-2) }
nav.tabs{ display:flex; gap:.2rem; padding:0 1rem; max-width:1400px; margin:0 auto; overflow-x:auto }
nav.tabs a{ padding:.5rem .8rem; text-decoration:none; color:var(--ink-2); border-bottom:2px solid transparent; white-space:nowrap }
nav.tabs a.on{ color:var(--ink); border-bottom-color:var(--accent); font-weight:600 }

main{ max-width:1400px; margin:0 auto; padding:1rem; padding-bottom:5rem }
.grid{ display:grid; gap:1rem; align-content:start }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)) }
.g3{ grid-template-columns:repeat(3,minmax(0,1fr)) }
.g-main{ grid-template-columns:minmax(0,2.1fr) minmax(0,1fr) }
.card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1rem; min-width:0 }
.card h2{ font-size:1.02rem; margin:0 0 .6rem; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap }
.card h2 .sub{ font-weight:400; font-size:.82rem; color:var(--muted) }
.card h3{ font-size:.95rem; margin:.8rem 0 .4rem }
.row{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap }
.seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:2px }
.seg button{ border:0; background:none; padding:.28rem .65rem; border-radius:6px; cursor:pointer; color:var(--ink-2); white-space:nowrap }
.seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); font-weight:600 }
.btn{ border:1px solid var(--border); background:var(--surface-2); padding:.35rem .75rem; border-radius:8px; cursor:pointer; white-space:nowrap }
.btn:hover{ background:var(--surface-3) }
.btn.primary{ background:var(--accent); color:#fff; border-color:transparent }
.btn.sm{ padding:.18rem .5rem; font-size:.85rem }
.linkbtn{ border:0; background:none; color:var(--accent-ink); cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:2px }

/* ---------- 統計卡 ---------- */
.tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr)); gap:.75rem }
.tile{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:.75rem .9rem; min-width:0 }
.tile .lab{ font-size:.82rem; color:var(--ink-2) }
.tile .val{ font-size:1.45rem; font-weight:650; line-height:1.25; margin-top:.15rem; white-space:nowrap }
.tile .dl{ font-size:.85rem }
.ratio{ display:flex; height:8px; border-radius:4px; overflow:hidden; margin:.45rem 0 .2rem; gap:2px }
.ratio i{ display:block; height:100% }
.meter{ position:relative; height:8px; border-radius:4px; margin:.5rem 0 .2rem;
  background:linear-gradient(90deg,var(--down),var(--neutral) 50%,var(--up)) }
.meter b{ position:absolute; top:-4px; width:4px; height:16px; border-radius:2px; background:var(--ink); transform:translateX(-2px); box-shadow:0 0 0 2px var(--surface) }

/* ---------- 表格 ---------- */
.tblwrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -.25rem }
table.t{ width:100%; border-collapse:collapse; font-size:.9rem }
table.t th{ text-align:left; font-weight:600; color:var(--ink-2); font-size:.8rem; padding:.4rem .5rem; border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; background:var(--surface) }
table.t td{ padding:.42rem .5rem; border-bottom:1px solid var(--grid); vertical-align:middle }
table.t tr.click{ cursor:pointer } table.t tr.click:hover td{ background:var(--accent-wash) }
table.t td.r,table.t th.r{ text-align:right }
.stk{ white-space:nowrap } .stk .code{ color:var(--muted); font-size:.82rem; margin-right:.3rem }
.tag{ display:inline-block; font-size:.74rem; padding:.05rem .4rem; border-radius:5px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2); white-space:nowrap; margin:1px 2px 1px 0 }
.tag.up{ color:var(--up); border-color:color-mix(in srgb,var(--up) 40%,transparent) }
.tag.down{ color:var(--down); border-color:color-mix(in srgb,var(--down) 40%,transparent) }
.tag.warn{ color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,transparent) }
.tag.acc{ color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 45%,transparent) }
.list{ margin:0; padding:0; list-style:none }
.list li{ display:flex; justify-content:space-between; gap:.5rem; padding:.35rem 0; border-bottom:1px solid var(--grid) }
.list li:last-child{ border-bottom:0 }
.empty{ color:var(--muted); padding:.8rem 0; text-align:center }

/* ---------- 圖表 ---------- */
.chart{ position:relative; width:100%; user-select:none; -webkit-user-select:none; touch-action:pan-y }
.chart svg{ display:block; width:100%; height:auto; overflow:visible }
.chart text{ fill:var(--muted); font-size:11px; font-family:inherit }
.chart .gl{ stroke:var(--grid); stroke-width:1 }
.chart .ax{ stroke:var(--axis); stroke-width:1 }
.chart .qlab{ font-size:12px; font-weight:600; fill:var(--ink-2) }
.chart .qcnt{ font-size:11px; fill:var(--muted) }
.chart .blab{ fill:var(--ink); font-size:11px; paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; pointer-events:none }
.bub{ stroke:var(--surface); stroke-width:2; cursor:pointer; transition:opacity .15s }
.bub:hover,.bub.sel{ stroke:var(--ink); stroke-width:2 }
.tip{ position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow);
  border-radius:8px; padding:.45rem .6rem; font-size:.82rem; z-index:20; min-width:9rem; max-width:16rem; line-height:1.45 }
.tip .tv{ font-weight:650; color:var(--ink) }
.tip .tr{ display:flex; justify-content:space-between; gap:.8rem }
.tip .tk{ color:var(--ink-2) }
.legend{ display:flex; gap:.9rem; flex-wrap:wrap; font-size:.8rem; color:var(--ink-2); align-items:center }
.legend i{ display:inline-block; width:14px; height:2px; vertical-align:middle; margin-right:.3rem; border-radius:1px }
.legend i.box{ height:10px; width:10px; border-radius:2px }
.zoomctl{ position:absolute; top:.35rem; right:.35rem; display:flex; gap:.3rem; align-items:center; z-index:2 }
.zoomctl .iconbtn{ justify-content:center; width:2rem; height:2rem; font-size:1.05rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow) }
.zoomctl .btn{ background:var(--surface); box-shadow:var(--shadow) }
.zoomctl.inline{ position:static; margin-left:auto }
.zoomctl.inline .iconbtn,.zoomctl.inline .btn{ box-shadow:none }
.chips{ display:flex; flex-wrap:wrap; gap:.35rem; align-items:center }
.chip{ display:inline-flex; align-items:center; gap:.25rem; border:1px solid var(--border); border-radius:999px; padding:.1rem .25rem .1rem .6rem; font-size:.82rem; background:var(--surface) }
.chip button{ border:0; background:none; color:var(--muted); cursor:pointer; padding:0 .3rem; font-size:.9rem; line-height:1 }
.chip button:hover{ color:var(--ink) }
.player{ display:flex; align-items:center; gap:.6rem; margin-top:.4rem }
.player input[type=range]{ flex:1; accent-color:var(--accent); min-width:0 }
.player .pd{ min-width:4.5rem; text-align:right; font-variant-numeric:tabular-nums }

details.info{ margin-top:.6rem; font-size:.86rem; color:var(--ink-2) }
details.info summary{ cursor:pointer; color:var(--accent-ink) }
details.info p,details.info li{ margin:.35rem 0 }
.summary-text{ line-height:1.8; font-size:.95rem }

/* ---------- 抽屜與對話框 ---------- */
.drawer-bg{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:50 }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(420px,100vw); background:var(--surface); z-index:51; box-shadow:var(--shadow);
  display:flex; flex-direction:column; border-left:1px solid var(--border) }
.drawer header{ display:flex; align-items:center; padding:.8rem 1rem; border-bottom:1px solid var(--border); gap:.5rem }
.drawer header h2{ margin:0; font-size:1.05rem; flex:1 }
.drawer .body{ overflow:auto; padding:1rem; flex:1 }
.field{ margin:.2rem 0 1rem }
.field > label,.field > .lab{ display:block; font-weight:600; font-size:.9rem; margin-bottom:.35rem }
.field .hint{ font-size:.8rem; color:var(--muted); margin-top:.25rem }
.numin{ width:5.5rem; padding:.3rem .45rem; border:1px solid var(--border); border-radius:6px; background:var(--surface-2) }
.chk{ display:flex; align-items:center; gap:.45rem; padding:.18rem 0 }
.chkgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr)); gap:.1rem .6rem; max-height:45vh; overflow:auto; border:1px solid var(--border); border-radius:8px; padding:.4rem .6rem }
.note{ padding:.6rem .2rem; border-bottom:1px solid var(--grid); cursor:pointer }
.note.unread{ background:var(--accent-wash); border-radius:6px; padding:.6rem }
.note .when{ font-size:.78rem; color:var(--muted) }

.prose{ max-width:52rem; line-height:1.75 }
.prose h2{ font-size:1.15rem; margin:1.6rem 0 .5rem }
.prose h3{ font-size:1rem; margin:1.2rem 0 .3rem }
.prose code,.formula{ font-family:ui-monospace,Consolas,monospace; background:var(--surface-2); padding:.05rem .35rem; border-radius:4px; font-size:.88em }
.formula{ display:block; padding:.5rem .7rem; margin:.4rem 0; white-space:pre-wrap }
.prose dt{ font-weight:650; margin-top:.9rem }
.prose dd{ margin:.2rem 0 0 0; color:var(--ink-2) }

.stockhead{ display:flex; gap:1rem; align-items:flex-end; flex-wrap:wrap }
.stockhead .nm{ font-size:1.4rem; font-weight:700 }
.stockhead .px{ font-size:1.6rem; font-weight:650 }
.kv{ display:grid; grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr)); gap:.5rem .9rem }
.kv div{ min-width:0 } .kv .k{ font-size:.78rem; color:var(--ink-2) } .kv .v{ font-weight:600 }

.welcome{ max-width:40rem; margin:3rem auto; line-height:1.8 }

/* ---------- 手機 ---------- */
@media (max-width: 900px){
  .g-main,.g2,.g3{ grid-template-columns:minmax(0,1fr) }
}
@media (max-width: 720px){
  main{ padding:.7rem; padding-bottom:5.5rem }
  .topbar{ padding:.5rem .7rem; gap:.45rem }
  .search{ order:5; flex:1 1 100% }
  nav.tabs{ position:fixed; bottom:0; left:0; right:0; z-index:35; background:var(--surface); border-top:1px solid var(--border);
    justify-content:space-around; padding:0 0 env(safe-area-inset-bottom) }
  nav.tabs a{ flex:1; text-align:center; padding:.6rem .2rem; font-size:.82rem; border-bottom:0; border-top:2px solid transparent }
  nav.tabs a.on{ border-top-color:var(--accent) }
  .card{ padding:.8rem; border-radius:10px }
  .tile .val{ font-size:1.25rem }
  .hide-m{ display:none !important }
}
@media (forced-colors: active){ .bub{ stroke:CanvasText } }

/* ---------- 動能模組 ---------- */
.envchip{ display:inline-flex; align-items:center; gap:.35rem; border:1.5px solid; border-radius:999px; padding:.1rem .65rem; font-weight:650; font-size:.9rem; white-space:nowrap }
.envchip i{ width:.6rem; height:.6rem; border-radius:50% }
.envchip.big{ font-size:1.25rem; padding:.2rem .9rem }
.envchip.big i{ width:.8rem; height:.8rem }
.envstrip{ display:inline-flex; gap:2px }
.envstrip i{ display:block; width:6px; height:18px; border-radius:2px }
tr.hotrow td{ opacity:.62 }
.tags{ display:inline; margin-left:.3rem }
th.sortable:hover{ color:var(--ink) }
@media (max-width: 720px){ nav.tabs a{ font-size:.78rem } .envstrip i{ width:4px } }

.envgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); gap:.6rem 1rem }
.envgrid .k{ font-size:.78rem; color:var(--ink-2) } .envgrid .v{ font-weight:650 }
.grid > *{ min-width:0 }
.warn{ color:var(--warn) }

tr.newrow td{ background:color-mix(in srgb, var(--up) 10%, transparent); animation: flash 1.2s ease-in-out 3 }
@keyframes flash{ 50%{ background:color-mix(in srgb, var(--up) 22%, transparent) } }

.mstrip{ display:inline-flex; align-items:baseline; gap:.35rem }
.chipwrap{ display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); gap:1rem 1.4rem; margin-bottom:.8rem }
.chipbox h3{ font-size:.85rem; font-weight:650; margin:0 0 .4rem; color:var(--ink-2) }
.chipbox .dn{ display:flex; gap:.9rem; align-items:center }
.chipbox svg{ flex:none }
.chipleg{ display:grid; gap:.3rem; font-size:.82rem; min-width:0 }
.chipleg div{ display:grid; grid-template-columns:10px 1fr auto; gap:.45rem; align-items:baseline }
.chipleg i{ width:10px; height:10px; border-radius:2px; display:inline-block; transform:translateY(1px) }
.chipleg b{ font-weight:650 }
.chipleg .tiny{ grid-column:2 / 4 }
.mstrip .k{ font-size:.78rem; color:var(--ink-2) }

</style>
</head>

const BASIS = {

/* ================= 資料模型 ================= */

/* 區間加總：arr[t][i]，從 t 往前 n 天 */

/* 個股：力道 = 今日淨額 ÷ 前 20 日淨額絕對值平均 */

/* 土洋 */

function summaryText(t, abnN) {
  const mk = M.days[t].mk, a = mk.taiex, b = mk.tpex, ud = marketUpDown(t), op = officialParts(t), on = officialNet(t);
  const st = sectorStats(t).filter(x => visibleSector(M.sectors[x.id]) && M.sectors[x.id].m.length >= 2);
  const top = st.slice().sort((x, y) => y.f1 - x.f1).slice(0, 3).filter(x => x.f1 > 0), bot = st.slice().sort((x, y) => x.f1 - y.f1)[0];
  const bs = v => v >= 0 ? '買超' : '賣超';
  let co = 0, cs = 0, coTop = null, stN = 0;
  for (let i = 0; i < M.N; i++) { const f = M.fi[t][i], it = M.it[t][i];
    if (f >= S.th.coBuy && it >= S.th.coBuy) { co++; if (!coTop || f + it > M.fi[t][coTop] + M.it[t][coTop]) coTop = i; }
    if (f <= -S.th.coBuy && it <= -S.th.coBuy) cs++;
    if (M.days[t].fi[i] > 0 && fiStreak(t, i).n >= S.th.streak) stN++; }
  const mgCh = t > 0 && (mk.has_margin || {}).TWSE && (mk.has_margin || {}).TPEX ? M.mgVal[t] - M.mgVal[t - 1] : null;
  const sent = sentiment(t);
  const parts = [];
  parts.push(`${fmt.date(M.dates[t])} ` + (a ? `加權指數${a.chg >= 0 ? '上漲' : '下跌'} ${Math.abs(a.chg).toFixed(2)} 點（${fmt.pct(a.pct)}），收 ${fmt.px(a.close)}` : '加權指數資料缺漏') +
    (b ? `；櫃買指數${b.chg >= 0 ? '上漲' : '下跌'} ${Math.abs(b.chg).toFixed(2)} 點，收 ${fmt.px(b.close)}。` : '。'));
  parts.push(`上市櫃普通股上漲 ${ud.up} 家、下跌 ${ud.dn} 家，多方比例 ${Math.round(ud.up / Math.max(1, ud.up + ud.dn) * 100)}%。`);
  if (on != null) parts.push(`${BASIS[M.basis].name}${bs(on)} ${Math.abs(on).toFixed(1)} 億元（外資${bs(op.fi)} ${Math.abs(op.fi).toFixed(1)} 億、投信${bs(op.it)} ${Math.abs(op.it).toFixed(1)} 億、自營商${bs(op.dsf + op.dsh)} ${Math.abs(op.dsf + op.dsh).toFixed(1)} 億）。`);
  if (top.length) parts.push(`法人買超最多的板塊為 ${top.map(x => `${x.name}（${x.f1.toFixed(1)} 億）`).join('、')}` + (bot && bot.f1 < 0 ? `；賣超最多的是 ${bot.name}（${bot.f1.toFixed(1)} 億）。` : '。'));
  parts.push(`外資投信同買 ${co} 檔${coTop != null ? `，以 ${M.names[coTop]} 金額最大` : ''}；同賣 ${cs} 檔。外資連買 ${S.th.streak} 天以上 ${stN} 檔，籌碼異常 ${abnN} 檔。`);

  if (sent.score != null) parts.push(`市場情緒指數 ${Math.round(sent.score)}（${sent.label}）。`);
  return parts.join('');

function momNotesX() {
  const out = [], nf = MS.notify, T = X.T, thr = MS.thr, codes = watchCodes(), pos = getPos(), liveT = X.live ? T - 1 : -1;
  for (let t = Math.max(1, T - 5); t < T; t++) {

      if (nf.stop && pos[c]) { const p = pos[c]; let tIn = X.dates.indexOf(p.date); if (tIn >= 0 && tIn <= t) { const pInA = p.price * X.AF[tIn][i]; let maxA = pInA; for (let k = tIn; k <= t; k++) maxA = Math.max(maxA, X.A[k][i] || 0);
        const stA = stopLevel(p.stop || MS.stop, t, i, pInA, maxA); if (X.A[t][i] < stA && !(X.A[t - 1][i] < stopLevel(p.stop || MS.stop, t - 1, i, pInA, maxA)))
          out.push({ id: `${X.dates[t]}|${c}|mstop`, date: X.dates[t], liveMom: t === liveT, t: mi != null ? M.dates.indexOf(X.dates[t]) : -1, xt: t, code: c, i: mi, text: `${t === liveT ? '盤中' : '收盤'} ${fmt.px(X.c[t][i])} 跌破停損 ${fmt.px(+toRaw(stA, t, i).toFixed(2))}（${stopName(p.stop || MS.stop)}）`, sg: -1 }); } }
      const s0 = X.score[t - 1][i], s1 = X.score[t][i], pre = t === liveT ? '盤中' : '';
      if (t === liveT && nf.liveUp !== false && !(s0 >= thr) && s1 >= thr)
        out.push({ id: `${X.dates[t]}|${c}|mup`, date: X.dates[t], liveMom: true, xt: t, code: c, i: mi, text: `盤中動能達標（${isNaN(s0) ? '—' : s0.toFixed(1)} → ${s1.toFixed(1)}，門檻 ${thr}）`, sg: 1 });
      if (s0 >= thr && !(s1 >= thr)) { const run = X.streak[t - 1][i];
        if (nf.short && run <= 2) out.push({ id: `${X.dates[t]}|${c}|mshort`, date: X.dates[t], liveMom: t === liveT, xt: t, code: c, i: mi, text: `${pre}動能只維持 ${run} 天就轉弱（${s0.toFixed(1)} → ${isNaN(s1) ? '—' : s1.toFixed(1)}）`, sg: -1 });
        else if (nf.drop) out.push({ id: `${X.dates[t]}|${c}|mdrop`, date: X.dates[t], liveMom: t === liveT, xt: t, code: c, i: mi, text: `${pre}動能掉到門檻以下（${s0.toFixed(1)} → ${isNaN(s1) ? '—' : s1.toFixed(1)}，先前連續 ${run} 天）`, sg: -1 }); } }
    if (nf.newEntry && t !== liveT && t >= T - (nf.newDays || 2) - (liveT >= 0 ? 1 : 0)) for (const st of MS.strategies.filter(s => nf.strategies.includes(s.id))) {
      const prev = new Set(strategyHits(st, t - 1));
      const nw = strategyHits(st, t).filter(i => !prev.has(i)).sort((a, b) => nz(X.score[t][b]) - nz(X.score[t][a])).slice(0, nf.maxPer);
      for (const i of nw) out.push({ id: `${X.dates[t]}|${X.codes[i]}|mnew_${st.id}`, date: X.dates[t], xt: t, code: X.codes[i], i: M.idx.get(X.codes[i]), text: `新進入「${st.name}」（動能 ${isNaN(X.score[t][i]) ? '—' : X.score[t][i].toFixed(1)}）`, sg: 1, name: X.names[i] });
    }
  }
  return out;
}

      kv('漲停', fmt.px(o.u)), kv('跌停', fmt.px(o.w)),
      outR != null ? kv('今日外盤比', Math.round(outR * 100) + '%', outR >= 0.55 ? 'up' : outR <= 0.45 ? 'down' : '', `啟動後 ${sd.val.toFixed(2)} 億`) : null),
    oldNote, off ? null : chart,
    off ? h('div', { class: 'tiny muted', style: { marginTop: '.3rem' } }, '分時圖只在盤中服務開著時看得到。晚上 run.bat 抓到官方收盤資料後，上方會改成顯示官方收盤價與法人買賣超。') : h('div', { class: 'tiny muted', style: { marginTop: '.3rem' } },
      first != null ? `分時從 ${minLab(first)} 開始記錄（本機服務啟動後才有，證交所不提供當天較早的分鐘資料）。` : '分時圖會在收到報價後開始畫。',
      '報價是快照、約落後 30～90 秒；三大法人買賣超收盤後才公布。')));
  if (bars.length && !off) requestAnimationFrame(() => drawIntraday(chart, bars, o));
}
function minLab(m) { const t = 540 + m; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function drawIntraday(container, bars, o) {
  const tip = chartBox(container);
  const old = container.querySelector('svg'); if (old) old.remove();
  const W = Math.max(320, container.clientWidth), H = W < 600 ? 210 : 240, pad = { l: 8, r: 56, t: 10, b: 22 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b, ph = ih * 0.72, vh = ih - ph - 6;
  let lo = Infinity, hi = -Infinity;
  for (const b of bars) { lo = Math.min(lo, b[3]); hi = Math.max(hi, b[2]); }
  if (o.y) { lo = Math.min(lo, o.y); hi = Math.max(hi, o.y); }
  const showH20 = o.h20 && o.h20 <= hi * 1.03 && o.h20 >= lo * 0.97;
  if (showH20) { lo = Math.min(lo, o.h20); hi = Math.max(hi, o.h20); }
  const padP = Math.max((hi - lo) * 0.08, hi * 0.002); lo -= padP; hi += padP;
  const X = m => pad.l + m / 270 * iw, Y = p => pad.t + (hi - p) / (hi - lo) * ph;
  const vol = bars.map((b, k) => k ? Math.max(0, b[4] - bars[k - 1][4]) : null);
  const vm = Math.max(1, ...vol.filter(v => v != null));
  const vb = pad.t + ph + 6 + vh;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '今日分時' });
  const st = niceStep((hi - lo) / 4);
  for (let v = Math.ceil(lo / st) * st; v <= hi; v += st) { const y = Y(v); svg.appendChild(s('line', { x1: pad.l, x2: W - pad.r, y1: y, y2: y, class: 'gl' })); svg.appendChild(s('text', { x: W - pad.r + 6, y: y + 4 }, fmt.px(+v.toFixed(2)))); }
  for (const m of W < 600 ? [0, 60, 120, 180, 240] : [0, 60, 120, 180, 240, 270]) { svg.appendChild(s('line', { x1: X(m), x2: X(m), y1: pad.t, y2: vb, class: 'gl' })); svg.appendChild(s('text', { x: X(m), y: H - 6, 'text-anchor': m === 270 ? 'end' : m === 0 ? 'start' : 'middle' }, minLab(m))); }
  if (o.y) { svg.appendChild(s('line', { x1: pad.l, x2: W - pad.r, y1: Y(o.y), y2: Y(o.y), stroke: 'var(--muted)', 'stroke-dasharray': '4 3' })); svg.appendChild(s('text', { x: pad.l + 4, y: Y(o.y) - 4 }, '平盤')); }
  if (showH20) { svg.appendChild(s('line', { x1: pad.l, x2: W - pad.r, y1: Y(o.h20), y2: Y(o.h20), stroke: 'var(--accent)', 'stroke-dasharray': '6 3' })); svg.appendChild(s('text', { x: pad.l + 4, y: Y(o.h20) - 4, fill: 'var(--accent)' }, '前 20 日高')); }
  const up = o.z >= o.y;
  let d = ''; bars.forEach((b, k) => { d += (k ? 'L' : 'M') + X(b[0]).toFixed(1) + ',' + Y(b[1]).toFixed(1); });
  svg.appendChild(s('path', { d, fill: 'none', stroke: up ? 'var(--up)' : 'var(--down)', 'stroke-width': 1.8, 'stroke-linejoin': 'round' }));
  const lb = bars[bars.length - 1]; svg.appendChild(s('circle', { cx: X(lb[0]), cy: Y(lb[1]), r: 3.2, fill: up ? 'var(--up)' : 'var(--down)' }));
  const bw = Math.max(1, iw / 270 * 0.7);
  vol.forEach((v, k) => { if (!v) return; const hh = Math.max(1, v / vm * vh); const c = bars[k][1] >= bars[k - 1][1] ? 'var(--up)' : 'var(--down)';
    svg.appendChild(s('rect', { x: X(bars[k][0]) - bw / 2, y: vb - hh, width: bw, height: hh, fill: c, opacity: 0.55 })); });
  svg.appendChild(s('text', { x: W - pad.r + 6, y: vb - vh + 8 }, fmtBig(vm) + ' 張'));
  const hit = s('rect', { x: pad.l, y: pad.t, width: iw, height: vb - pad.t, fill: 'transparent' }); svg.appendChild(hit);
  const cross = s('line', { y1: pad.t, y2: vb, stroke: 'var(--ink-2)', 'stroke-width': 1, opacity: 0, 'pointer-events': 'none' }); svg.appendChild(cross);
  container.insertBefore(svg, tip);
  hit.addEventListener('pointermove', ev => {
    const rect = svg.getBoundingClientRect(); const m = ((ev.clientX - rect.left) * W / rect.width - pad.l) / iw * 270;
    let k = 0, best = Infinity; bars.forEach((b, j) => { const dd = Math.abs(b[0] - m); if (dd < best) { best = dd; k = j; } });
    const b = bars[k]; cross.setAttribute('x1', X(b[0])); cross.setAttribute('x2', X(b[0])); cross.setAttribute('opacity', 0.4);
    showTip(container, tip, X(b[0]) * rect.width / W, ev.clientY - rect.top, [h('div', { style: { fontWeight: 650 } }, minLab(b[0])),
      tipRow('價格', fmt.px(b[1]), cls(b[1] - o.y)), tipRow('漲跌幅', o.y ? fmt.pct((b[1] / o.y - 1) * 100) : '—', cls(b[1] - o.y)),
      tipRow('這分鐘高／低', `${fmt.px(b[2])}／${fmt.px(b[3])}`), tipRow('這分鐘量', vol[k] != null ? fmt.int(vol[k]) + ' 張' : '—'), tipRow('累計量', fmt.int(b[4]) + ' 張')]);
  });
  hit.addEventListener('pointerleave', () => { hideTip(tip); cross.setAttribute('opacity', 0); });
}

/* 個股頁標頭的即時列：點進來最上面就看得到現價 */
function drawStockLiveHead(code) {
  const el = document.getElementById('slhead'); if (!el) return;
  const d = stockSnap(), o = d ? lv(code, d) : null, off = !liveUp();
  if (!d || !o || !o.z) { el.replaceChildren(d && !off && d.status !== 'closed' ? h('span', { class: 'small muted' }, '盤中：等待報價…') : !d ? h('span', { class: 'small muted' }, '盤中即時：未連線（說明見下方「今日盤中」）') : ''); return; }
  const chg = o.z - o.y, pct = o.y ? chg / o.y * 100 : NaN;
  el.replaceChildren(h('span', { class: 'tag ' + (!off && d.status === 'open' ? 'acc' : '') }, off ? `${fmt.date(d.date)} 收盤（盤中服務記錄）` : LIVE_STATUS[d.status] || d.status),
    h('b', { class: 'num ' + cls(chg), style: { fontSize: '1.15rem', marginLeft: '.4rem' } }, fmt.px(o.z)),
    h('span', { class: 'num ' + cls(chg), style: { marginLeft: '.4rem' } }, `${chg > 0 ? '▲' : chg < 0 ? '▼' : ''}${fmt.px(Math.abs(+chg.toFixed(2)))}（${fmt.pct(pct)}）`),
    h('span', { class: 'small muted', style: { marginLeft: '.5rem' } }, `量 ${fmt.int(o.v)} 張・${o.t || d.updated || ''}`));
}
